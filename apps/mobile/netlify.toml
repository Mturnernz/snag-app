# This site's "Base directory" must be set to apps/mobile in the Netlify
# dashboard (repo root now hosts an npm-workspaces monorepo — see
# SNAG_WEB_APP_PLAN.md §1) so paths below resolve relative to this folder.
[build]
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The web app manifest, which is what gives an "Add to Home screen" shortcut a
# 192/512px icon instead of the 48px favicon Expo's export would otherwise leave
# it to scale up (see public/index.html). Stated explicitly because a manifest
# served as anything other than a JSON media type is rejected outright, and the
# symptom of that is silent: the icon quietly falls back to the favicon again.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Security headers for the Expo web export. apps/web sets the equivalent set in
# next.config.js — these two hosts are separate Netlify sites, so neither
# inherits the other's headers and both have to say it.
#
# Deliberately different from the portal's in three places:
#
#   * camera=(self). This is the app, and photographing a snag is the whole
#     point of it. Nothing uses it on web today — expo-camera does have a web
#     implementation, but the app deliberately keeps it out of the web bundle
#     (see CLAUDE.md and src/lib/camera.web.ts) — but denying it here is how a
#     future web capture path fails silently rather than loudly.
#   * blob: and data: in img-src, which the photo picker's local previews need
#     before anything is uploaded.
#   * blob: in connect-src, which is how a picked photo is *read*. On web,
#     expo-image-manipulator hands back an object URL and `readForUpload`
#     fetches it for its bytes (src/lib/uploadBody.ts) — a fetch, so connect-src
#     governs it, and Chrome does not let 'self' cover blob:. The portal needs
#     none of this: its uploads come off an <input type="file"> as real File
#     objects and never touch an object URL.
#
#     Shipping this policy without it broke every upload on app.snaghq.co.nz for
#     a day — photos, evidence, and both document paths — and said "no
#     connection" while doing it, because a blocked fetch and an offline phone
#     raise the identical TypeError. Nothing else could see it: the read fails
#     before any request, so there is no failed request in the Storage logs, no
#     4xx anywhere, and the thumbnails still render (img-src already had blob:).
#     img-src and connect-src both need it, for two different reasons; adding
#     one is not a hint that the other is covered.
#
# frame-ancestors 'none' still applies: nothing should embed the app, and a
# framed copy is how a QR-code landing page gets turned into a phishing shell.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' blob: https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=()"
