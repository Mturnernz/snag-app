<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Snag">
  <!--
    The same mark the app ships: an S drawn as a cotter pin, white on fern
    (#2E6A4F — Colors.primary, shared by both apps). The master is
    apps/mobile/public/icons/icon-512.svg; this is the 32px cut, with a heavier
    relative stroke because a hairline disappears at 16px.

    App Router picks this file up automatically as the favicon. Rounded here,
    unlike the app's own tile, because nothing crops a browser favicon.
  -->
  <rect width="32" height="32" rx="7" fill="#2E6A4F"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="3.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 20.7 11.3 A 4.3 4.3 0 1 0 13.4 13.4 L 18.6 18.6 A 4.3 4.3 0 1 1 11.3 20.7" />
  </g>
</svg>
