<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: "Hanken Grotesk", system-ui, "Segoe UI", Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #2E6A4F; } a:hover { color: #24543E; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FAF7F2; color: #2B2724; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- Header -->
  <div style="background: #FFFFFF; border-bottom: 1px solid #E7DFD3; padding: 56px 16px 12px 16px; display: flex; align-items: center; gap: 4px;">
    <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2724" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <div class="mono" style="flex-grow: 1; font-size: 15px; font-weight: 500; letter-spacing: 0.01em;">SNAG-0014</div>
    <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#736A5F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M9.5 6.5V4.6h5v1.9M6.6 6.5l.9 13a1.4 1.4 0 0 0 1.4 1.3h6.2a1.4 1.4 0 0 0 1.4-1.3l.9-13"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 16px 20px 0 20px; display: flex; flex-direction: column; overflow: hidden;">

    <!-- Photo strip -->
    <div style="display: flex; gap: 9px;">
      <div style="width: 196px; height: 116px; border-radius: 14px; overflow: hidden; flex-shrink: 0;">
        <svg width="196" height="116" viewBox="0 0 196 138" fill="none"><rect width="196" height="138" fill="#EFE7DA"/><circle cx="66" cy="52" r="40" fill="#DCCDB4" opacity="0.85"/><rect x="86" y="66" width="120" height="86" rx="16" fill="#C9B79A" opacity="0.75"/><path d="M0 104c34-16 62-10 96 4 26 11 56 12 100 0v34H0z" fill="#B9A488" opacity="0.6"/></svg>
      </div>
      <div style="width: 110px; height: 116px; border-radius: 14px; overflow: hidden; flex-shrink: 0;">
        <svg width="110" height="116" viewBox="0 0 110 138" fill="none"><rect width="110" height="138" fill="#ECE5DA"/><path d="M0 40h110v14H0zM0 66h110v14H0zM0 92h110v14H0z" fill="#D3C3AC" opacity="0.9"/><path d="M6 62l100-10v16L6 78z" fill="#BFA98C"/></svg>
      </div>
    </div>

    <div style="font-size: 22px; font-weight: 700; line-height: 1.22; letter-spacing: -0.015em; margin-top: 13px; text-wrap: pretty;">Gutters need clearing before winter</div>

    <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 10px;">
      <div style="padding: 4px 10px; border-radius: 999px; background: #E9EFF6; color: #35526E; font-size: 12px; font-weight: 600;">Open</div>
      <div style="display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: #F7EEDC; color: #8F6117; font-size: 12px; font-weight: 600;">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M5.5 1.8v2.4M10.5 1.8v2.4M2.5 6.6h11"/></svg>
        Due in 5 days
      </div>
      <div style="display: flex; align-items: center; gap: 4px; color: #736A5F; font-size: 12.5px;">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14s4.4-4.2 4.4-7.4A4.4 4.4 0 0 0 3.6 6.6C3.6 9.8 8 14 8 14Z"/><circle cx="8" cy="6.4" r="1.6"/></svg>
        Outside
      </div>
    </div>

    <div style="font-size: 13px; color: #736A5F; margin-top: 8px;">Added by Alyssa &middot; last done <span class="mono" style="font-size: 12.5px;">18 Apr 2026</span></div>

    <!-- Status actions -->
    <div style="display: flex; gap: 10px; margin-top: 14px;">
      <div style="flex-grow: 1; height: 48px; border-radius: 13px; border: 1.5px solid #D8CEC0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #2B2724;">Start it</div>
      <div style="flex-grow: 1; height: 48px; border-radius: 13px; background: #2E6A4F; display: flex; align-items: center; justify-content: center; gap: 7px; box-shadow: 0 2px 8px rgba(46,106,79,0.22);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.4 12.2l2.5 2.5 4.7-4.9"/></svg>
        <span style="color: #FFFFFF; font-size: 15px; font-weight: 600;">Mark done</span>
      </div>
    </div>

    <!-- Triage. Every control writes on tap; there is no Save button. -->
    <div style="margin-top: 16px; background: #FFFFFF; border-radius: 18px; padding: 16px 16px 17px 16px; box-shadow: 0 1px 2px rgba(43,39,36,0.04), 0 6px 18px rgba(43,39,36,0.06);">
      <div style="font-size: 17px; font-weight: 700;">Sort it out</div>

      <div style="font-size: 12.5px; font-weight: 600; color: #5C554C; margin-top: 14px;">How urgent?</div>
      <div style="display: flex; gap: 8px; margin-top: 8px;">
        <div style="padding: 9px 18px; border-radius: 11px; background: #2E6A4F; color: #FFFFFF; font-size: 13.5px; font-weight: 600;">High</div>
        <div style="padding: 9px 18px; border-radius: 11px; background: #FAF7F2; border: 1px solid #E7DFD3; color: #5C554C; font-size: 13.5px;">Low</div>
      </div>

      <div style="font-size: 12.5px; font-weight: 600; color: #5C554C; margin-top: 16px;">How long will it take?</div>
      <div style="display: flex; gap: 8px; margin-top: 8px;">
        <div style="padding: 9px 15px; border-radius: 11px; background: #FAF7F2; border: 1px solid #E7DFD3; color: #5C554C; font-size: 13.5px;">Quick</div>
        <div style="padding: 9px 15px; border-radius: 11px; background: #2E6A4F; color: #FFFFFF; font-size: 13.5px; font-weight: 600;">Half day</div>
        <div style="padding: 9px 15px; border-radius: 11px; background: #FAF7F2; border: 1px solid #E7DFD3; color: #5C554C; font-size: 13.5px;">Big job</div>
      </div>

      <div style="display: flex; align-items: center; gap: 11px; margin-top: 18px;">
        <div style="width: 23px; height: 23px; border-radius: 7px; background: #2E6A4F; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 8.3l2.6 2.6 6.2-6.4"/></svg>
        </div>
        <div style="flex-grow: 1;">
          <div style="font-size: 14.5px; font-weight: 500;">Needs something from the shop</div>
          <div style="font-size: 12.5px; color: #736A5F; margin-top: 1px;">Collected into one list on the Weekend tab</div>
        </div>
      </div>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 54px; background: linear-gradient(to bottom, rgba(250,247,242,0), #FAF7F2); pointer-events: none;"></div>

</div>
</x-dc>
</body>
</html>
